[workspace]
resolver = "2"
members = [
    "crates/savelens-core",
    "crates/savelens-codecs",
    "crates/savelens-cas",
    "crates/savelens-discovery",
    "crates/savelens-watcher",
    "crates/savelens-tui",
    "crates/savelens-gui",
    "crates/savelens-overlay",
    "crates/savelens-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gabildev/savelens"
authors = ["SaveLens contributors"]

[workspace.dependencies]
# Internal crates
savelens-core = { path = "crates/savelens-core" }
savelens-codecs = { path = "crates/savelens-codecs" }
savelens-cas = { path = "crates/savelens-cas" }
savelens-discovery = { path = "crates/savelens-discovery" }
savelens-watcher = { path = "crates/savelens-watcher" }
savelens-tui = { path = "crates/savelens-tui" }
savelens-gui = { path = "crates/savelens-gui" }
savelens-overlay = { path = "crates/savelens-overlay" }

# Errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Data
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
indexmap = { version = "2", features = ["serde"] }
blake3 = "1.8"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

# Compression
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
lz4_flex = "0.11"
zstd = "0.13"
base64 = "0.22"

# Crypto / checksums
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
ecb = { version = "0.1", features = ["alloc", "block-padding"] }
ctr = "0.9"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
crc32fast = "1"
crc32c = "0.6"

# Storage
rusqlite = { version = "0.32", features = ["bundled", "backup", "blob"] }
fastcdc = "3"

# System
dirs = "6"
glob = "0.3"
notify = "8"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
global-hotkey = "0.6"
parking_lot = "0.12"
crossbeam-channel = "0.5"
tempfile = "3"
regex = "1"
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_ProcessStatus"] }
libc = "0.2"

# UI
ratatui = "0.29"
crossterm = "0.28"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
nucleo-matcher = "0.3"
clap = { version = "4", features = ["derive", "env"] }

# Testing
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
