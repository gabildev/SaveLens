# SaveLens builtin save-path rules (Ludusavi-style templates).
#
# Placeholders: <home> <base> (install dir) <game> (installdir name) <root> (Steam root)
# <storeUserId> (matches any Steam user id) <xdgData> <xdgConfig> <winAppData>
# <winLocalAppData> <winLocalAppDataLow> <winDocuments> <winSavedGames> <winPublic>.
#
# `os = "windows"` paths apply on Windows and to Proton games on Linux (resolved inside the
# Wine prefix); `os = "linux"` paths apply to native Linux builds; `os = "any"` always applies.
# `patterns` are globs matched against file paths relative to the save root.

[[game]]
id = "stardew-valley"
name = "Stardew Valley"
app_ids = [413150]
patterns = ["*"]
paths = [
  { path = "<winAppData>/StardewValley/Saves", os = "windows" },
  { path = "<xdgConfig>/StardewValley/Saves", os = "linux" },
]

[[game]]
id = "terraria"
name = "Terraria"
app_ids = [105600]
patterns = ["*.plr", "*.wld", "*.bak", "*.twld", "*.tplr", "*.bak2"]
paths = [
  { path = "<winDocuments>/My Games/Terraria/Players", os = "windows" },
  { path = "<winDocuments>/My Games/Terraria/Worlds", os = "windows" },
  { path = "<xdgData>/Terraria/Players", os = "linux" },
  { path = "<xdgData>/Terraria/Worlds", os = "linux" },
]

