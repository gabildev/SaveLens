# Real-game save corpus expectations, checked by
# crates/savelens-codecs/tests/real_saves.rs. Fetch the files with
# scripts/fetch-real-saves.sh (see README.md in this directory for sources).
#
# Fields:
#   file      path below tests/real-saves/corpus
#   game      human readable game name
#   app_id    Steam AppID passed to the DetectContext (optional)
#   codec     expected structural codec id
#   layers    substrings that must appear in the envelope layers, in order
#   lossless  expected Safe Edit Gate result (structural round trip bit-exact)
#   edit      optional { path = "...", value = ... }: structural edit that must
#             survive encode_verified + a fresh re-open

[[save]]
file = "unreal/deep-rock-galactic.sav"
game = "Deep Rock Galactic"
codec = "gvas"
lossless = true
edit = { path = "Credits", value = 9999999 }

